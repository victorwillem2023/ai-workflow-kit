# The weekly security run: libraries with known vulnerabilities (OSV-Scanner, Trivy), our own code (Semgrep), the Dockerfile
# and infrastructure files (Trivy), and secrets anywhere in git's history (gitleaks), as one report in plain words: an issue
# labelled "security-report" (last week's is closed). It never fails on a finding: it reports. Library fixes that exist come as
# pull requests by themselves (Renovate, or Dependabot security updates); /secops in a session proposes the rest.
# The scanner versions live in workflow/tools/secops.mjs (SCANNERS).
name: secops
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - name: Scan
        run: node workflow/tools/secops.mjs --scan-to secops-out
      - name: Write the report
        run: node workflow/tools/secops.mjs --report secops-out --out secops-report.md
      - name: Publish it as this week's issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node workflow/tools/secops.mjs --publish secops-report.md
      - name: Keep the scanners' own output for 30 days
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secops-${{ github.run_id }}
          path: |
            secops-out/
            secops-report.md
          retention-days: 30
