# The same checks as `npm run gate:all`, on every push and pull request, so main cannot break when a step was skipped locally.
name: gate
on:
  push:
    branches: [main]
  pull_request:
# it only reads the code: nothing it runs can push, comment or change a setting, whatever the repository's default allows
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      # another language: add its toolchain here (for Rust: dtolnay/rust-toolchain@stable with clippy)
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: node workflow/tools/gate.mjs --all
