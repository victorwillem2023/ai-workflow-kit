# The skill scenarios (scripts/skilltest.mjs) with the real Claude Code: an agent runs each skill on a throwaway project and the
# script checks what it did. It costs money (roughly $0.50 to $1 for all of them), so it runs only when it can catch something:
# on a push or pull request that changes a skill, the stop-point hook or the rules every agent reads, and by hand (Actions,
# "skilltest", Run workflow, optionally naming scenarios). It needs the ANTHROPIC_API_KEY secret in the repository's settings;
# without it (a fork's pull request, a repository that never set it) the run says so and passes.
name: skilltest
on:
  push:
    branches: [main]
    paths:
      - 'payload/.claude/skills/**'
      - 'modules/*/payload/.claude/skills/**'
      - 'payload/workflow/scripts/stop-points.mjs'
      - 'starter/CLAUDE.md'
      - 'starter/settings.local.json'
      - 'scripts/skilltest.mjs'
  pull_request:
    paths:
      - 'payload/.claude/skills/**'
      - 'modules/*/payload/.claude/skills/**'
      - 'payload/workflow/scripts/stop-points.mjs'
      - 'starter/CLAUDE.md'
      - 'starter/settings.local.json'
      - 'scripts/skilltest.mjs'
  workflow_dispatch:
    inputs:
      scenarios:
        description: 'Scenarios to run, separated by spaces (empty: all; node scripts/skilltest.mjs --list names them)'
        required: false
        default: ''
permissions:
  contents: read
# one run per branch at a time: a newer push makes the older run stop, so a busy day is not paid for twice
concurrency:
  group: skilltest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  skilltest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: starter/.tool-versions
      # (not pinned yet: pin the version the scenarios last passed with, as the kit pins its other tools)
      - run: npm install -g @anthropic-ai/claude-code
      - run: git config --global user.name "Skill test" && git config --global user.email skilltest@example.invalid
      # the names through the environment, never pasted into the command (what is typed into a form is not trusted as shell)
      - run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "skilltest: no ANTHROPIC_API_KEY secret here, so the scenarios were not run"; exit 0; fi
          node scripts/skilltest.mjs $SCENARIOS
        env:
          SCENARIOS: ${{ inputs.scenarios }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
