# The kit checks itself: on every push and pull request, install it into fresh projects and run the project's tests and the
# full gate there, then an --update over each (scripts/selftest.mjs). One job per variant: TypeScript with every module and ai,
# lean, the cluster module, a Vite starter, Python, Go and Rust on Linux; full and lean on Windows too. In CI a variant whose
# tools are missing fails instead of being skipped.
name: selftest
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        variant: [full, lean, minimal, cluster, vite, python, go, rust, messy]
        include:
          - { os: windows-latest, variant: full }
          - { os: windows-latest, variant: lean }
    runs-on: ${{ matrix.os }}
    name: selftest (${{ matrix.os }}, ${{ matrix.variant }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the messy variant installs an older kit from its tag
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: starter/.tool-versions
      - if: matrix.variant == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - if: matrix.variant == 'python'
        run: pipx install uv
      - if: matrix.variant == 'rust'
        run: cargo install cargo-machete cargo-audit --locked
      - run: node scripts/selftest.mjs ${{ matrix.variant }}
