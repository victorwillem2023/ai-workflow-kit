# Argo CD's view of {{PROJECT}} in staging: the chart in this repository with values-staging.yaml. The image tag (the commit) is set
# by the deploy: deploy.environments.staging.command runs "argocd app set {{PREFIX}}-staging --helm-set image.tag={version}" and a
# sync, then the deploy script checks /health and rolls back the same way (docs/run/CLUSTER.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{PREFIX}}-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/{{REPO}}.git
    targetRevision: main
    path: deploy/helm/app
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: {{PREFIX}}-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
